[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckcdm"
version = "0.4.4"
description = "DuckCDM — DuckDB-powered OMOP CDM engine: OHDSI SqlRender, Circe, Achilles and an ATLAS 3.0-compatible WebAPI in pure Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "Hyung-Chul Lee", email = "lucid80@gmail.com" }]
keywords = ["omop", "cdm", "ohdsi", "atlas", "sqlrender", "circe", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vitaldb/duckcdm"
Source = "https://github.com/vitaldb/duckcdm"

[project.optional-dependencies]
server = ["duckdb>=1.0", "fastapi>=0.100", "uvicorn>=0.20"]

[project.scripts]
duckcdm = "duckcdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"duckcdm.sqlrender" = ["csv/*.csv"]
"duckcdm.circe" = ["sql/*.sql"]
"duckcdm.omop" = ["*.csv"]
"duckcdm.achilles" = ["sql/*.sql", "csv/*.csv"]
"duckcdm.webapi" = ["sql/*/*.sql", "sql/*/*/*.sql", "sql/*/*/*/*.sql", "static/atlas/*", "static/atlas/*/*", "static/atlas/*/*/*"]
